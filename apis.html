<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote & Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .weather-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .weather-section h2 {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        #weather {
            font-size: 1.1em;
            line-height: 1.6;
        }

        .quote-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .quote-section h2 {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        #quote {
            font-size: 1.2em;
            font-style: italic;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        #author {
            text-align: right;
            color: #666;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Daily Inspiration</h1>
        
        <div class="weather-section">
            <h2>Current Weather</h2>
            <div id="weather" class="loading">Click the button to load...</div>
        </div>

        <div class="quote-section">
            <h2>Inspirational Quote</h2>
            <div id="quote" class="loading">Click the button to load...</div>
            <div id="author"></div>
        </div>

        <button id="fetchBtn">Get New Quote & Weather ✨</button>
    </div>

    <script>
      const button = document.getElementById('fetchBtn');

      button.addEventListener('click', function() {
        console.log('Button clicked!');
        
        // Quote API
        fetch('https://api.quotable.io/random')
        .then(response => response.json())
        .then(data => {
            console.log('Quote data:', data);
            const quote = document.getElementById("quote");
            const author = document.getElementById("author");
    
            quote.textContent = data.content;
            author.textContent = "— " + data.author;
        })
        .catch(error => console.log('Quote error:', error));
    
        // Weather API - Using weatherapi.com (free tier)
        fetch('https://api.weatherapi.com/v1/current.json?key=demo&q=Nairobi')
        .then(response => response.json())
        .then(data => {
            console.log('Weather data:', data);
            const weather = document.getElementById("weather");
            
            const temp = data.current.temp_c;
            const condition = data.current.condition.text;
            const location = data.location.name;
            
            weather.textContent = `${condition} • ${temp}°C • ${location}`;
        })
        .catch(error => {
            console.log('Weather error:', error);
            const weather = document.getElementById("weather");
            weather.textContent = '☀️ Sunny • 24°C • Nairobi (Demo data)';
        });
      });
    </script>
</body>
</html>
